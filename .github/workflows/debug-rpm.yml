name: rpm 诊断（一次性）

# R60：v0.5.1 的 Linux job 在「上传到 Release」一步挂了——deb/AppImage 传上了，
# rpm 和 latest-linux.yml 缺。本机（macOS）复现不了 x64 打包，照 debug-e2e.yml 的手法
# 起这个一次性工作流抓 rpm 打包的全量日志：日志落在 ci-debug-log 分支，拿到就删本文件。
#
# 触发：本文件被 push 即触发（paths 过滤），不需要打 tag。
on:
  push:
    paths:
      - '.github/workflows/debug-rpm.yml'

permissions:
  contents: write

jobs:
  debug-rpm:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 rpm 打包工具
        # 与 release.yml 的 build-linux job 完全一致，保证是同一个环境
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: 环境信息
        run: node -e 'console.log("node", process.version)'; npx electron-builder --version

      - name: 构建（npm run build）
        run: npm run build

      - name: 只打 rpm（不发布，捕获全量输出）
        continue-on-error: true
        run: |
          set -o pipefail
          DEBUG='electron-builder*' npx electron-builder --linux rpm 2>&1 | Tee-Object rpm-out.txt || true
        shell: pwsh

      - name: 归档产物清单
        if: always()
        run: ls -lh release/ > release-ls.txt || true

      - name: 推送日志到 ci-debug-log 分支
        if: always()
        run: |
          git config user.email "ci-debug@local"
          git config user.name "ci-debug"
          git checkout --orphan ci-debug-log
          git reset
          git add rpm-out.txt release-ls.txt
          git commit -m "ci rpm log"
          git push -f origin ci-debug-log
