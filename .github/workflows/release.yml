name: 构建与发布

# 触发条件：
#   - 推送 tag（v1.0.0 之类）→ 构建 Windows 产物并发布到 GitHub Release
#   - 手动触发（workflow_dispatch）→ 只构建，不发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows x64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 端到端测试
        run: npm run test:e2e

      - name: 校验图标资源
        shell: pwsh
        run: |
          if (-not (Test-Path build/icon.ico)) { throw '缺少 build/icon.ico' }
          if (-not (Test-Path electron/resources/tray-16.png)) { throw '缺少托盘图标' }

      - name: 构建
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包（上传到 Release）
        # 只在有 tag 且确实要发布时上传
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包（仅本地产物）
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)) }}
        run: npx electron-builder --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 归档产物
        uses: actions/upload-artifact@v4
        with:
          name: IKanBot-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: 汇总
        run: |
          Write-Host "---- 产物 ----"
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }

  build-macos:
    # 排在 Windows 后面：Windows 先创建 Release，macOS 再往里传，避免两个 job 同时创建同名 Release
    needs: build-windows
    runs-on: macos-latest
    name: macOS x64 + arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 端到端测试
        run: npm run test:e2e

      - name: 校验图标资源
        run: |
          test -f build/icon_1024.png || { echo '缺少 build/icon_1024.png'; exit 1; }
          test -f electron/resources/tray-16.png || { echo '缺少托盘图标'; exit 1; }

      - name: 构建
        run: npm run build

      - name: 打包（上传到 Release）
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有 Apple 开发者证书：关闭自动查找签名身份，产物未签名
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 打包（仅本地产物）
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)) }}
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 归档产物
        uses: actions/upload-artifact@v4
        with:
          name: IKanBot-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: 汇总
        run: |
          ls -lh release/*.dmg release/*.zip

  build-linux:
    # 同样排在后面，沿用 Windows 已创建好的 Release
    needs: build-macos
    runs-on: ubuntu-latest
    name: Linux x64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 端到端测试
        run: npm run test:e2e

      - name: 校验图标资源
        run: |
          test -f build/icon_1024.png || { echo '缺少 build/icon_1024.png'; exit 1; }
          test -f electron/resources/tray-16.png || { echo '缺少托盘图标'; exit 1; }

      - name: 构建
        run: npm run build

      - name: 安装 rpm 打包工具
        # rpmbuild 不在 ubuntu-latest 的默认镜像里，deb 和 AppImage 用不到
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: 打包（上传到 Release）
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包（仅本地产物）
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)) }}
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 归档产物
        uses: actions/upload-artifact@v4
        with:
          name: IKanBot-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest-linux.yml
            release/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: 汇总
        run: |
          ls -lh release/*.AppImage release/*.deb release/*.rpm
