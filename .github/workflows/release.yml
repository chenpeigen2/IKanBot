name: 构建与发布

# 触发条件：
#   - 推送 tag（v1.0.0 之类）→ 构建 Windows 产物并发布到 GitHub Release
#   - 手动触发（workflow_dispatch）→ 只构建，不发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows x64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 端到端测试
        run: npm run test:e2e

      - name: 校验图标资源
        shell: pwsh
        run: |
          if (-not (Test-Path build/icon.ico)) { throw '缺少 build/icon.ico' }
          if (-not (Test-Path electron/resources/tray-16.png)) { throw '缺少托盘图标' }

      - name: 构建
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包（上传到 Release）
        # 只在有 tag 且确实要发布时上传
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包（仅本地产物）
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)) }}
        run: npx electron-builder --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 归档产物
        uses: actions/upload-artifact@v4
        with:
          name: IKanBot-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: 汇总
        run: |
          Write-Host "---- 产物 ----"
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }
